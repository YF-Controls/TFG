<!-- routerLinkActive="bg-primary"
#rla="routerLinkActive" -->
<a 
  [routerLink]="path()"
  class=
    "w-full inline-flex
    items-center
    py-3
    rounded-lg
    border-b border-slate-700
    bg-secondary hover:bg-primary
    group
    transition ease-linear duration-150
    "
  [class.justify-center]="isCollapsed()"
  [class.px-5]="isCollapsed()"
  [class.justify-start]="!isCollapsed()"
  [class.px-2]="!isCollapsed()">
  
  <!-- Icon -->
  <div
    class="flex items-center justify-center text-secondary-content">
    <app-svg-icon
      customClass="group-hover:text-primary-content"
      [name]="svgIconNameComputed()"/>
  </div>
  
  @if (!isCollapsed()) {
  <!-- Text block -->
  <div 
    class="flex flex-col ml-4">
    <!-- Title -->
    <span 
      class = "
        text-base md:text-lg font-bold leading-5
        text-secondary-content group-hover:text-primary-content">
      {{ title() }}
    </span>
    <!-- Subtitle -->
    <span 
      class="
        pt-1
        text-xs md:text-sm italic
         text-secondary-content/40 group-hover:text-primary-content/50">
      {{ subtitle() }}
    </span>
  </div>
  }
  
</a>
