<!-- Container -->
<div class="bg-gray-900 text-white border border-primary">
  <!-- Header -->
  <header class="flex gap-2 justify-between items-center border-b border-primary">
    <!-- Title -->
    <h1 class="tex-2xl font-montserrat ml-2 font-bold text-primary text-center">
      {{ 'DEVICE_TYPES.EDIT_DEVICE_TYPE.TITLE' | translate }}
    </h1>
    <!-- Cancel button -->
    <button 
      class="btn btn-primary m-1" 
      (click)="onCancel()">
      <!-- Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
        <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
      </svg>
    </button>
  </header>

  <!-- Form -->
  <form 
    class="mx-10 my-5 flex flex-col gap-3 items-center"
    [formGroup]="form"
    (ngSubmit) = "onSubmit()">
    <!-- Name field  -->
    <label class="flex items-center gap-2 input input-bordered">
      <!-- Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 opacity-70">
        <path d="M10.5 18.75a.75.75 0 0 0 0 1.5h3a.75.75 0 0 0 0-1.5h-3Z" />
        <path fill-rule="evenodd" d="M8.625.75A3.375 3.375 0 0 0 5.25 4.125v15.75a3.375 3.375 0 0 0 3.375 3.375h6.75a3.375 3.375 0 0 0 3.375-3.375V4.125A3.375 3.375 0 0 0 15.375.75h-6.75ZM7.5 4.125C7.5 3.504 8.004 3 8.625 3H9.75v.375c0 .621.504 1.125 1.125 1.125h2.25c.621 0 1.125-.504 1.125-1.125V3h1.125c.621 0 1.125.504 1.125 1.125v15.75c0 .621-.504 1.125-1.125 1.125h-6.75A1.125 1.125 0 0 1 7.5 19.875V4.125Z" clip-rule="evenodd" />
      </svg>
      <!--Input -->
      <input
        type="text"
        id="name"
        name="name"
        placeholder="{{ 'DEVICE_TYPES.EDIT_DEVICE_TYPE.FORM.NAME_PLACEHOLDER' | translate }}"
        formControlName="name"/>
    </label>
    
    <app-form-field-error  [control]="form.controls['name']" />

    <!-- hwId field  -->
    <label class="flex items-center gap-2 input input-bordered">
      <!-- Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 opacity-70">
        <path fill-rule="evenodd" d="M12 6.75a5.25 5.25 0 0 1 6.775-5.025.75.75 0 0 1 .313 1.248l-3.32 3.319c.063.475.276.934.641 1.299.365.365.824.578 1.3.64l3.318-3.319a.75.75 0 0 1 1.248.313 5.25 5.25 0 0 1-5.472 6.756c-1.018-.086-1.87.1-2.309.634L7.344 21.3A3.298 3.298 0 1 1 2.7 16.657l8.684-7.151c.533-.44.72-1.291.634-2.309A5.342 5.342 0 0 1 12 6.75ZM4.117 19.125a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75h-.008a.75.75 0 0 1-.75-.75v-.008Z" clip-rule="evenodd" />
        <path d="m10.076 8.64-2.201-2.2V4.874a.75.75 0 0 0-.364-.643l-3.75-2.25a.75.75 0 0 0-.916.113l-.75.75a.75.75 0 0 0-.113.916l2.25 3.75a.75.75 0 0 0 .643.364h1.564l2.062 2.062 1.575-1.297Z" />
        <path fill-rule="evenodd" d="m12.556 17.329 4.183 4.182a3.375 3.375 0 0 0 4.773-4.773l-3.306-3.305a6.803 6.803 0 0 1-1.53.043c-.394-.034-.682-.006-.867.042a.589.589 0 0 0-.167.063l-3.086 3.748Zm3.414-1.36a.75.75 0 0 1 1.06 0l1.875 1.876a.75.75 0 1 1-1.06 1.06L15.97 17.03a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
      </svg>
      <!-- Input -->
      <input
        type="text"
        id="hwId"
        name="hwId"
        placeholder="{{ 'DEVICE_TYPES.EDIT_DEVICE_TYPE.FORM.HWID_PLACEHOLDER' | translate }}"
        formControlName="hwId"/>
    </label>
    
    <app-form-field-error  [control]="form.controls['hwId']" />
    
    <!-- description field -->
    <label class="flex items-start gap-2 textarea textarea-bordered">
      <!-- Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 opacity-70">
        <path d="M11.25 4.533A9.707 9.707 0 0 0 6 3a9.735 9.735 0 0 0-3.25.555.75.75 0 0 0-.5.707v14.25a.75.75 0 0 0 1 .707A8.237 8.237 0 0 1 6 18.75c1.995 0 3.823.707 5.25 1.886V4.533ZM12.75 20.636A8.214 8.214 0 0 1 18 18.75c.966 0 1.89.166 2.75.47a.75.75 0 0 0 1-.708V4.262a.75.75 0 0 0-.5-.707A9.735 9.735 0 0 0 18 3a9.707 9.707 0 0 0-5.25 1.533v16.103Z" />
      </svg>
      <!-- Input -->
      <textarea
        id="description"
        name="description"
        placeholder="{{ 'DEVICE_TYPES.EDIT_DEVICE_TYPE.FORM.DESCRIPTION_PLACEHOLDER' | translate }}"
        rows="3"
        class="grow resize-none"
        formControlName="description"></textarea>
    </label>
    
    <!-- isActive field -->
    <label class="flex items-center gap-2">
      {{ 'DEVICE_TYPES.EDIT_DEVICE_TYPE.FORM.IS_ACTIVE_LABEL' | translate }}
      <!-- Input -->
      <input
        class="checkbox bg-primary text-black"
        type="checkbox"
        id="isActive"
        name="isActive"
        formControlName="isActive"/>
    </label>
    
    <!-- Submit button -->      
    <button 
      type="submit"
      class="btn btn-primary mt-5">
      <!-- Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 opacity-70">
        <path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-8.4 8.4a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32l8.4-8.4Z" />
        <path d="M5.25 5.25a3 3 0 0 0-3 3v10.5a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3V13.5a.75.75 0 0 0-1.5 0v5.25a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5V8.25a1.5 1.5 0 0 1 1.5-1.5h5.25a.75.75 0 0 0 0-1.5H5.25Z" />
      </svg>
    </button>
    
  </form>
</div>
