<!-- Title -->
<h1 class="tex-2xl font-montserrat font-bold text-primary text-center">
  {{ 'AUTH.REGISTER_USER.TITLE' | translate }}
</h1>


<!-- Login form -->
<form 
  class="mt-4 flex flex-col gap-2"
  [formGroup]="form"
  (ngSubmit) = "onSubmit()">

  <!-- Fullname field -->
  <label class="flex items-center gap-2 input input-bordered">
    <!-- icon -->
    <app-svg-icon name="user"/>
    <!-- input -->
    <input
      type="text"
      class="grow"
      placeholder="{{ 'AUTH.REGISTER_USER.FORM.FULLNAME_PLACEHOLDER' | translate }}"
      formControlName="fullname"/>
  </label>

  <app-form-field-error  [control]="form.controls['fullname']" />

  <!-- Email field -->
  <label class="flex items-center gap-2 input input-bordered">
    <!-- icon -->
    <app-svg-icon name="email"/>
    <!-- input -->
    <input
      type="text"
      class="grow"
      placeholder="{{ 'AUTH.REGISTER_USER.FORM.EMAIL_PLACEHOLDER' | translate }}"
      formControlName="email"/>
  </label>

  <app-form-field-error  [control]="form.controls['email']" />

  <!-- Password 1 field -->
  <label class="flex items-center gap-2 input input-bordered">
    <!-- icon -->
    <app-svg-icon name="key"/>
    <!-- input -->
    <input
      [type]="showPassword1() ? 'text' : 'password'"
      class="grow"
      placeholder="{{ 'AUTH.REGISTER_USER.FORM.PASSWORD_PLACEHOLDER' | translate }}"
      formControlName="password1"/>
    <!-- show/hide button -->
    <button
      type="button"
      tabindex="-1"
      (click)="toggleShowPassword1()">
      <!-- show/hide icon -->
      @if (showPassword1()) {<app-svg-icon name="eye-show"/>}
      @else {<app-svg-icon name="eye-hide"/>}
    </button> 
  </label>
  
  <app-form-field-error  [control]="form.controls['password1']" />
  
  <!-- Password 2 field -->
  <label class="flex items-center gap-2 input input-bordered">
    <!-- icon -->
    <app-svg-icon name="key"/>
    <!-- input -->
    <input
      [type]="showPassword2() ? 'text' : 'password'"
      class="grow"
      placeholder="{{ 'AUTH.REGISTER_USER.FORM.REPEAT_PASSWORD_PLACEHOLDER' | translate }}"
      formControlName="password2"
    />

    <!-- Show/hide button -->
    <button
      type="button"
      tabindex="-1"
      (click)="toggleShowPassword2()">
      <!-- show/hide icon -->
      @if (showPassword2()) {<app-svg-icon name="eye-show"/>}
      @else {<app-svg-icon name="eye-hide"/>}
    </button>
  </label>
  
  <app-form-field-error  [control]="form.controls['password2']" />

  <!-- Submit button -->
  <button 
    type="submit" 
    class="btn btn-primary"
  >
    {{ 'AUTH.REGISTER_USER.FORM.SUBMIT_BUTTON' | translate }}
  </button>
  
</form>

<!-- Register link -->
<div class="mt-4 flex flex-col items-center gap-2">
  <p class="text-slate-700">
    {{ 'AUTH.REGISTER_USER.LOGIN.TEXT' | translate }}

    <a routerLink="/auth/login" class="text-primary">
      {{ 'AUTH.REGISTER_USER.LOGIN.LINK' | translate }}
    </a>
  </p>
</div>
