<!-- Header -->
<header
  class=" 
    sticky top-0 z-20
    bg-base-200
    shadow-lg
    border-b-2 border-primary/50
    flex justify-between items-center
    px-2 py-5">
  <!--Logo -->
  <app-layout-brand-name
    [isSidebarCollapsed]="false"/>
  
  <!-- Language Switcher button -->
  <section
    class="
      flex-1
      flex flex-row justify-end items-center gap-1 md:gap-5">
    <app-layout-theme-switcher
      [isSidebarCollapsed]="false"/>
    <app-layout-language-switcher
      [isSidebarCollapsed]="false"/>
  </section>

</header>

<!-- Main -->
<main
  class="
    flex-1 overflow-auto
    flex justify-center items-center">
  
  <router-outlet/>  
    
</main>
