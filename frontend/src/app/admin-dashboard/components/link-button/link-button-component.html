<a 
  [routerLink]="path()"
  routerLinkActive="bg-primary"
  #rla="routerLinkActive"
  class="w-full px-2 inline-flex space-x-2 items-center
         border-b border-slate-700 py-3 hover:bg-white/5
         transition ease-linear duration-150">
  
  <!-- Icon -->
  <div
    [ngClass]="rla.isActive ? 'text-black flex items-center justify-center' :
              'text-white flex items-center justify-center'"
    [innerHTML]="safeSvgIcon()">
  </div>

  <!-- Text block -->
  <div class="flex flex-col">

    <!-- Title -->
    <span 
      [ngClass]="rla.isActive ? 'text-black text-lg font-bold leading-5' :
                'text-white text-lg font-bold leading-5'">
      {{ title() }}
    </span>
    
      <!-- Subtitle -->
    <span 
      [ngClass]="rla.isActive ? 'text-black/50 text-sm hidden md:block' :
                'text-white/50 text-sm hidden md:block'">
      {{ subtitle() }}
    </span>
  </div>
</a>
