<!-- Header -->
<header class="app-page-header">
  <!-- Tile and Subtitle part -->
  <div>
    <!-- Title -->
    <h1 class="app-page-header-title">
      {{ 'ADMIN_DASHBOARD.DEVICES_ADMIN_PAGE.TITLE' | translate }}
    </h1>
    <!--  -->
    <h2 class="app-page-header-subtitle">
      {{ 'ADMIN_DASHBOARD.DEVICES_ADMIN_PAGE.TOTAL' | translate }}
      <span >{{devicesResource.value()?.length}}</span>
    </h2>
  </div>

  <!-- Add button -->
  <button 
    class="app-page-header-button"
    (click)="onAdd()">
    <!-- Add icon -->
    <app-svg-icon name="add"/>
  </button>
  
</header>

<!-- Divider -->
<div class="app-page-header-divider"></div>

<!-- Table -->
<app-device-table
  [devices]="devicesResource.value() ?? []"
  [deviceTypes]="deviceTypesResource.value() ?? []"
  [deviceAreas]="deviceAreasResource.value() ?? []"
  (updateTable)="onUpdateTable()"/>
