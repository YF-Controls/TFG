<!-- Header -->
<header class="app-page-header">
  <!-- Tile and Subtitle part -->
  <div>
    <!-- Title -->
    <h1 class="app-page-header-title">
      {{ 'ADMIN_DASHBOARD.ADMIN_DASHBOARD_PAGE.TITLE' | translate }}
    </h1>
    <!--  -->
    <h2 class="app-page-header-subtitle">
      {{ 'ADMIN_DASHBOARD.ADMIN_DASHBOARD_PAGE.SUBTITLE' | translate }}
    </h2>
  </div>
</header>

<!--Main -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-4">
  
  <!-- Users Chart -->
  <app-doughnut-chart-component
    translationBase="ADMIN_DASHBOARD.ADMIN_DASHBOARD_PAGE.USERS_CARD"
    [total]="usersStats().total"
    [actives]="usersStats().active"/>
  
  <!-- Devices Chart -->
  <app-doughnut-chart-component
    translationBase="ADMIN_DASHBOARD.ADMIN_DASHBOARD_PAGE.DEVICES_CARD"
    [total]="devicesStats().total"
    [actives]="devicesStats().active"/>

  <!-- Device Types Chart -->
  <app-doughnut-chart-component
    translationBase="ADMIN_DASHBOARD.ADMIN_DASHBOARD_PAGE.DEVICE_TYPES_CARD"
    [total]="deviceTypesStats().total"
    [actives]="deviceTypesStats().active"/>

  <!-- Device Areas Chart -->
  <app-doughnut-chart-component
    translationBase="ADMIN_DASHBOARD.ADMIN_DASHBOARD_PAGE.DEVICE_AREAS_CARD"
    [total]="deviceAreasStats().total"
    [actives]="deviceAreasStats().active"/>

</div>
