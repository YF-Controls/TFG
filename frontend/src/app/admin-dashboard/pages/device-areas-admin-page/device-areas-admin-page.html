<!-- Header -->
<header class="flex flex-2 gap-2 justify-between items-center">
  <!-- Tile and Subtitle part -->
  <div>
    <!-- Title -->
    <h1 class="text-2xl text-primary font-bold">
      {{ 'ADMIN_DASHBOARD.DEVICE_AREAS_ADMIN_PAGE.TITLE' | translate }}
    </h1>
    <!--  -->
    <h2 class="text-lg text-primary/50">
      {{ 'ADMIN_DASHBOARD.DEVICE_AREAS_ADMIN_PAGE.TOTAL' | translate }}
      <span >{{deviceAreasResource.value()?.length}}</span>
    </h2>
  </div>

  <!-- Add button -->
  <button 
    class="btn btn-primary"
    (click)="onAdd()">
    <!-- Add icon -->
    <app-svg-icon name="add"/>
  </button>
  
</header>

<!-- Divider -->
<div class="divider my-0"></div>

<!-- Table -->
<app-device-area-table 
  [deviceAreas]="deviceAreasResource.value() ?? []"
  (updateTable)="onUpdateTable()"/>
