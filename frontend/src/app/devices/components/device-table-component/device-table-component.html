<div class="overflow-x-auto">
  <table class="table">

    <!-- Header -->
    <thead>
      <tr>
        <!-- col 1 -->
        <th class="text-white font-bold">
          Status
        </th>
        <!-- col 2 -->
        <th class="text-white font-bold">
          Number
        </th>
        <!-- col 3 -->
        <th class="text-white font-bold">
          Name
        </th>
        <!-- col 4 -->
        <th class="text-white font-bold">
          Type
        </th>
        <!-- col 5 -->
        <th class="text-white font-bold">
          Area
        </th>
        <!-- col 6 -->
        <th class="text-white font-bold">
          Description
        </th>
        <!-- col 7: Details, no header -->
        <!-- empty -->
      </tr>
    </thead>

    <!-- Rows -->
    <tbody>

      @for (device of devices(); track device.id) {
      
        <!-- row x -->
        <tr>
          
          <!-- Col 1: Status -->
          <th>
            <div class="flex items-center gap-3">
              <div 
                class="badge bg-green-500"
                [ngClass]="device.isActive ? 'bg-green-500' : 'bg-red-500'" >
              </div>
            </div>
          </th>

          <!-- Col 2: Nr -->
          <td>
            <div class="flex items-center gap-3">
              <div class="">
                {{ device.nr }}
              </div>
            </div>
          </td>
          
          <!-- Col 3: Name -->
          <td>
            <div class="flex items-center gap-3">
              <div class="font-bold">
                {{ device.name }}
              </div>
            </div>
          </td>
          
          <!-- Col 4: Type -->
          <td>
            <div class="flex items-center gap-3">
              <div class="text-sm opacity-50">
                {{ getDeviceTypeName(device.deviceTypeId) }}
              </div>
            </div>
          </td>

          <!-- Col 5: Area -->
          <td>
            <div class="flex items-center gap-3">
              <div class="text-sm opacity-50">
                {{ getDeviceAreaName(device.deviceAreaId) }}
              </div>
            </div>
          </td>
          <!-- Col 6: Description -->
          <td>
            <div class="flex items-center gap-3">
              <div class="text-sm opacity-50">
                {{ device.description }}
              </div>
            </div>
          </td>

          <!-- Col 7: Details button -->
          <th>
            <a 
              [routerLink]="['/devices', device.id]"
              class="btn btn-ghost text-accent btn-xs">
              <button>
                <app-svg-icon name="edit"/>
              </button>
              <button>
                <app-svg-icon name="delete" />
              </button>
            </a>
            
          </th>
          
        </tr>
      
      } 
      @empty {
        <span>No devices found!</span>
      }
      
    </tbody>
  </table>
</div>
