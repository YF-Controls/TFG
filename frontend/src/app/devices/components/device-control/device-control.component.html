<div class="inline-flex flex-col m-2 border rounded-xl border-primary">

  <p class="text-primary mx-2 mt-2">{{ name() }}</p>

  <div
    class="flex gap-2 items-center m-2">

    <button
      class="btn btn-primary"
      (click)="setOn()">
      On
    </button>

    <button
      class="btn btn-primary"
      (click)="setOff()">
      Off
    </button>
  
    <div
      class="text-primary rounded-xl border py-2 px-4"
      >
      @switch (status()) {
        @case ('on') {
          ON
        }
        @case ('off') {
          OFF
        }
        @default {
          ?
        }
      }
    </div>
  </div>
</div>
