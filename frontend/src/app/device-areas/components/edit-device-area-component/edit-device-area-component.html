<!-- Container -->
<div class="app-popup-container">
  <!-- Header -->
  <header class="app-popup-header">
    <!-- Title -->
    <h1 class="app-popup-header-title">
      {{ 'DEVICE_AREAS.EDIT_DEVICE_AREA.TITLE' | translate }}
    </h1>
    <!-- Cancel button -->
    <button 
      class="app-popup-header-close-button" 
      (click)="onCancel()">
      <!-- Icon -->
      <app-svg-icon name="close"/>
    </button>
  </header>

  <!-- Loading -->
  @if (deviceArea.isLoading() ) {
    <div 
      id="loading"
      class="
        fixed top-1/2 left-1/2 z-10
        -translate-x-1/2 -translate-y-1/2
        p-20
        bg-base-100/70 border border-primary rounded-lg shadow-lg ">
      <span class="loading loading-spinner loading-xl"></span>
    </div>
  }
  
  <!-- Body -->
  <div class="app-popup-body">
    <!-- Form -->
    <form 
      [formGroup]="form"
      class="app-form-container hidden"
      (ngSubmit) = "onSubmit()">

      <!-- Name field  -->
      <div class="app-form-field-input">
        <label class="input">
          <!-- Icon -->
          <app-svg-icon name="device"/>
          <!--Input -->
          <input
            type="text"
            id="name"
            name="name"
            placeholder="{{ 'DEVICE_AREAS.EDIT_DEVICE_AREA.FORM.NAME_PLACEHOLDER' | translate }}"
            formControlName="name"/>
        </label>
      </div>
      <app-form-field-error  [control]="form.controls['name']" />

      <!-- hwId field  -->
      <div class="app-form-field-input">
        <label class="input">
          <!-- Icon -->
          <app-svg-icon name="hw"/>
          <!-- Input -->
          <input
            type="text"
            id="hwId"
            name="hwId"
            placeholder="{{ 'DEVICE_AREAS.EDIT_DEVICE_AREA.FORM.HWID_PLACEHOLDER' | translate }}"
            formControlName="hwId"/>
        </label>
      </div>
      <app-form-field-error  [control]="form.controls['hwId']" />
      
      <!-- description field -->
      <div class="app-form-field-input">
        <label class="textarea flex ">
          <!-- Icon -->
          <app-svg-icon name="book"/>
          <!-- Input -->
          <textarea
            id="description"
            name="description"
            placeholder="{{ 'DEVICE_AREAS.EDIT_DEVICE_AREA.FORM.DESCRIPTION_PLACEHOLDER' | translate }}"
            rows="3"
            class="grow resize-none pl-1"
            formControlName="description"></textarea>
        </label>
      </div>
      
      <!-- isActive field -->
      <div class="app-form-field-checkbox">
        <!-- title -->
        <span class="app-form-field-checkbox-span">
          {{ 'DEVICE_AREAS.EDIT_DEVICE_AREA.FORM.STATUS_LABEL' | translate }}
        </span>
        <!-- Checkbox container -->
        <div class="app-form-field-checkbox-container">
          <!-- Checkbox row -->
          <label class="app-form-field-checkbox-item">
            <!-- Input -->
            <input
              class="app-form-field-checkbox-item-input"
              type="checkbox"
              id="isActive"
              name="isActive"
              formControlName="isActive"/>
            <!-- title -->
            <span class="app-form-field-checkbox-item-text">
              {{ 'DEVICE_AREAS.EDIT_DEVICE_AREA.FORM.IS_ACTIVE_LABEL' | translate }}
            </span>
          </label>
        </div>
      </div>
      
      <!-- Submit button -->      
      <div class="app-form-field-submit">
        <button 
          type="submit"
          [disabled]="deviceArea.isLoading()"
          class="app-form-field-submit-button">
          <!-- Icon -->
          <app-svg-icon name="edit"/>
        </button>
      </div>

    </form>
  </div>
</div>
